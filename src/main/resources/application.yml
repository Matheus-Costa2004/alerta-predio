spring:
  application:
    name: alerta-predio
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/alerta}
      # Cria os índices das entidades (ex.: código de convite e token únicos)
      auto-index-creation: true
  jackson:
    # Campos nulos ficam fora do JSON
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

alerta:
  ambiente: ${APP_ENV:local}
  versao: ${APP_VERSION:dev}
  seed:
    enabled: ${SEED_ENABLED:false}
  # 2ª advertência por má-fé suspende o botão de alerta por este número de dias
  suspensao-dias: 30
  ia:
    # fake: classificador determinístico (local e testes) | gemini: API de visão do Google
    provedor: ${IA_PROVEDOR:fake}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      modelo: ${GEMINI_MODELO:gemini-3.5-flash-lite}
      url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout: 15s
  push:
    vapid-chave-publica: ${VAPID_PUBLIC_KEY:}
    vapid-chave-privada: ${VAPID_PRIVATE_KEY:}
    vapid-assunto: ${VAPID_SUBJECT:mailto:alerta-predio@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    nome: AlertaPrédio
    versao: ${alerta.versao}
    ambiente: ${alerta.ambiente}

# Swagger ligado também em produção, de propósito
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

logging:
  file:
    # Vazio = só console; no docker-compose vai para o volume api-logs
    name: ${LOG_FILE:}
